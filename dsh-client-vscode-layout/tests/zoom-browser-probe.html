<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>中栏统一缩放 · 真实浏览器布局探针</title>
<style>
/* 与 lib/client.js 中注入的缩放相关 CSS 保持一致（.vk_* 前缀原样拷贝） */
body{margin:0;font:12px/1.5 system-ui,sans-serif}
#host{width:800px;height:600px;display:flex;flex-direction:column;border:1px solid #999}
.vk_zoomWrap{flex:1;min-height:0;overflow:hidden;position:relative;background:#fff}
.vk_zoomStage{position:relative;overflow:hidden}
.vk_zoomFrame{position:absolute;left:0;top:0;border:0;display:block;background:#fff;transform-origin:0 0}
.vk_zoomMask{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;cursor:zoom-in}
</style>
</head>
<body>
<div id="host">
  <div class="vk_zoomWrap" id="wrap">
    <div class="vk_zoomStage" id="stage">
      <iframe id="fr" class="vk_zoomFrame" title="probe"></iframe>
    </div>
  </div>
</div>
<pre id="out">RUNNING</pre>
<script>
window.addEventListener('error', (e) => {
  const el = document.getElementById('out');
  if (el) el.textContent = 'PROBE_ERROR ' + String(e.message) + ' @line ' + String(e.lineno);
});
const ZOOM_MIN = 0.25, ZOOM_MAX = 5, ZOOM_BTN_STEP = 1.25, ZOOM_WHEEL_MAX = 600;
const clampZoom = (z, min, max) => {
  const lo = Number.isFinite(min) ? min : ZOOM_MIN, hi = Number.isFinite(max) ? max : ZOOM_MAX;
  const v = Number(z);
  if (!Number.isFinite(v)) return lo;
  return Math.min(hi, Math.max(lo, v));
};
const normalizeWheelDelta = (dy, dm) => {
  const d = Number(dy); if (!Number.isFinite(d)) return 0;
  const m = Number(dm);
  if (m === 1) return d * (100 / 3);
  if (m === 2) return d * 100;
  return d;
};
const wheelZoomFactor = (dy, dm) => {
  const d = Math.max(-ZOOM_WHEEL_MAX, Math.min(ZOOM_WHEEL_MAX, normalizeWheelDelta(dy, dm)));
  if (d === 0) return 1;
  return Math.pow(ZOOM_BTN_STEP, -d / 100);
};
const scaleScroll = (start, viewBefore, viewAfter) => {
  const s = Number(start) || 0, a = Number(viewBefore) || 0, b = Number(viewAfter) || 0;
  if (!(a > 0) || !(b > 0)) return Math.max(0, s);
  return Math.max(0, s * (b / a));
};

const wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');
const fr = document.getElementById('fr');
const log = [];
const say = (k, v) => { log.push([k, v]); };
let zoom = 1;
let mask = null;
let parentWheelSeen = 0;
let innerPrev = null;

// 子页面：同源（srcdoc 继承父文档源）；#mark 用 width:100% 以便量"是否跟着重排"
fr.srcdoc = '<!doctype html><html><body style="margin:0;background:#eee">'
  + '<div id="mark" style="width:100%;height:40px;background:#8cf">mark</div>'
  + '<div id="tall" style="height:4000px;background:linear-gradient(#fff,#333)"></div></body></html>';

function layout() {
  const w = wrap.clientWidth || 0, h = wrap.clientHeight || 0;
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  // 浏览器缩放语义：逻辑尺寸 = 中栏 ÷ zoom，再 transform 放大回中栏尺寸
  fr.style.width = (w / zoom) + 'px';
  fr.style.height = (h / zoom) + 'px';
  fr.style.transform = 'scale(' + zoom + ')';
}
function setZoom(next) {
  const b = clampZoom(next, ZOOM_MIN, ZOOM_MAX);
  const prev = zoom;
  // 与组件一样：缩放前记下框架内部视口尺寸与滚动位置，缩放后按浏览器语义换算回去
  let doc = null;
  try { doc = fr.contentDocument; } catch { doc = null; }
  const win = doc === null ? null : doc.defaultView;
  const scroller = doc === null ? null : (doc.scrollingElement || doc.documentElement);
  const before = (scroller === null || win === null)
    ? null
    : { w: win.innerWidth, h: win.innerHeight, sl: scroller.scrollLeft, st: scroller.scrollTop };
  zoom = b;
  layout();
  if (before !== null && b !== prev) {
    scroller.scrollLeft = scaleScroll(before.sl, before.w, win.innerWidth);
    scroller.scrollTop = scaleScroll(before.st, before.h, win.innerHeight);
  }
}
wrap.addEventListener('wheel', (e) => {
  parentWheelSeen += 1;
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const next = clampZoom(zoom * wheelZoomFactor(e.deltaY, e.deltaMode), ZOOM_MIN, ZOOM_MAX);
  if (next !== zoom) setZoom(next);
}, { passive: false });
function bindInner() {
  let doc = null;
  try { doc = fr.contentDocument; } catch { doc = null; }
  if (!doc || doc.__probeBound === true) return !!doc;
  doc.__probeBound = true;
  doc.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    const next = clampZoom(zoom * wheelZoomFactor(e.deltaY, e.deltaMode), ZOOM_MIN, ZOOM_MAX);
    if (next !== zoom) setZoom(next);
  }, { passive: false });
  return true;
}
function setCtrl(held) {
  if (held && mask === null) {
    mask = document.createElement('div');
    mask.className = 'vk_zoomMask';
    stage.appendChild(mask);
  } else if (!held && mask !== null) {
    mask.remove();
    mask = null;
  }
}
// 组件里有一模一样的 ResizeObserver：中栏尺寸变了要重新算逻辑尺寸
let roFires = 0;
new ResizeObserver(() => { roFires += 1; layout(); }).observe(wrap);
layout();

const fire = (target, opts) => target.dispatchEvent(new WheelEvent('wheel', Object.assign({ bubbles: true, cancelable: true }, opts)));
const rect = (el) => { const r = el.getBoundingClientRect(); return [Math.round(r.width), Math.round(r.height)]; };
const inner = () => {
  const doc = fr.contentDocument;
  const win = fr.contentWindow;
  const scroller = doc.scrollingElement || doc.documentElement;
  return { doc, win, scroller };
};

setTimeout(() => {
  say('sameOriginIframe', bindInner());
  const pane = [wrap.clientWidth, wrap.clientHeight];
  say('pane', pane);

  // ① 100%：铺满中栏、外层无滚动条、内部视口 = 中栏
  say('zoom1_frameRect', rect(fr));
  say('zoom1_outerScrollable', wrap.scrollWidth > wrap.clientWidth || wrap.scrollHeight > wrap.clientHeight);
  say('zoom1_innerViewport', [inner().win.innerWidth, inner().win.innerHeight]);
  // ② 200%：绘制尺寸仍是中栏尺寸（自适应）、内部视口减半（浏览器缩放语义）、外层仍无滚动条
  setZoom(2);
  say('zoom2_frameRect', rect(fr));
  say('zoom2_outerScrollable', wrap.scrollWidth > wrap.clientWidth || wrap.scrollHeight > wrap.clientHeight);
  say('zoom2_innerViewport', [inner().win.innerWidth, inner().win.innerHeight]);
  say('zoom2_markWidth', Math.round(inner().doc.getElementById('mark').getBoundingClientRect().width));
  // ③ 50%：内部视口翻倍（相当于浏览器缩到 50% 时 CSS 视口变宽）
  setZoom(0.5);
  say('zoom05_innerViewport', [inner().win.innerWidth, inner().win.innerHeight]);
  say('zoom05_frameRect', rect(fr));
  // ④ 缩放换算内部滚动（浏览器语义：读到哪里还停在哪一段）
  setZoom(1);
  const W1 = inner().win.innerWidth;
  inner().scroller.scrollTop = 1000;
  const before = inner().scroller.scrollTop;
  setZoom(2);
  say('innerScroll_zoomIn', [before, inner().scroller.scrollTop, Math.round(before * inner().win.innerWidth / W1)]);
  setZoom(1);
  // ⑤ 命中测试：不按 Ctrl 时 iframe 可点；按住 Ctrl 时捕获层接管
  say('hit_noCtrl', document.elementFromPoint(100, 100).tagName);
  setCtrl(true);
  say('hit_ctrl', document.elementFromPoint(100, 100).className);
  // ⑥ 不按 Ctrl 的滚轮：父文档收到但不缩放（交给网页自身滚动）
  const z0 = zoom;
  fire(stage, { deltaY: -100, ctrlKey: false });
  say('bareWheel_zoomUnchanged', zoom === z0);
  say('bareWheel_parentHandlerSawIt', parentWheelSeen);
  // ⑦ Ctrl+滚轮打在捕获层上 → 一档 25%
  fire(mask, { deltaY: -100, ctrlKey: true });
  say('ctrlWheelOnMask_zoom', zoom);
  // ⑧ 不按 Ctrl 时打在 iframe 内部：父文档收不到（架构原因）；同源时靠框架内监听拦 Ctrl+滚轮
  const seenBefore = parentWheelSeen;
  const mark = inner().doc.getElementById('mark');
  mark.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: -100, ctrlKey: false }));
  say('innerBareWheel_parentSeenDelta', parentWheelSeen - seenBefore);
  const zBeforeInner = zoom;
  mark.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: -100, ctrlKey: true }));
  say('innerCtrlWheel_zoomed', zoom > zBeforeInner);
  // ⑨ 上下限 / 复位
  setZoom(99); say('clampTop', zoom);
  setZoom(0.01); say('clampBottom', zoom);
  setZoom(1); say('reset_zoom', zoom);
  say('reset_frameRect', rect(fr));
  setCtrl(false);
  say('maskRemovedAfterCtrlRelease', document.querySelector('.vk_zoomMask') === null);
  setTimeout(() => {
    say('settled_frameRect', rect(fr));
    say('settled_outerScrollable', wrap.scrollWidth > wrap.clientWidth || wrap.scrollHeight > wrap.clientHeight);
    say('roFireCount', roFires);
    document.getElementById('out').textContent = 'PROBE_RESULT ' + JSON.stringify(log);
  }, 200);
}, 300);
</script>
</body>
</html>
